# Monero Stagenet Node Configuration
# Used for testing payment gateways, webhooks, and wallet integrations without real XMR.

stagenet=1
data-dir=/home/monero/.bitmonero
log-file=/dev/stdout
log-level=0

# Storage & Pruning
prune-blockchain=1
sync-pruned-blocks=1
db-sync-mode=safe

# Stagenet P2P Consensus Network
p2p-bind-ip=0.0.0.0
p2p-bind-port=38080
no-igd=1
enable-dns-blocklist=1

# Unrestricted RPC (container loopback)
rpc-bind-ip=127.0.0.1
rpc-bind-port=38081

# Stagenet Restricted Wallet RPC
rpc-restricted-bind-ip=0.0.0.0
rpc-restricted-bind-port=38089
public-node=1
confirm-external-bind=1
rpc-access-control-origins=*
disable-rpc-ban=1
