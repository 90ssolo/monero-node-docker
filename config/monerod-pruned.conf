# Monero Mainnet Pruned Node Configuration
# Stores ~1/8th of historical ring signature data plus recent blocks (~95 GB total)
# while verifying every block and transaction from genesis.

data-dir=/home/monero/.bitmonero
log-file=/dev/stdout
log-level=0

# Storage & Pruning
prune-blockchain=1
sync-pruned-blocks=1
db-sync-mode=safe

# P2P Consensus Network
p2p-bind-ip=0.0.0.0
p2p-bind-port=18080
out-peers=32
in-peers=64
limit-rate-up=16384
limit-rate-down=32768
no-igd=1
enable-dns-blocklist=1

# Unrestricted RPC (bound strictly to container loopback)
rpc-bind-ip=127.0.0.1
rpc-bind-port=18081

# Restricted Wallet RPC (safe for external/wallet connections)
rpc-restricted-bind-ip=0.0.0.0
rpc-restricted-bind-port=18089
public-node=1
confirm-external-bind=1
rpc-access-control-origins=*
max-Connections-per-ip=10
disable-rpc-ban=1
