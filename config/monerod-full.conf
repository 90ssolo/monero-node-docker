# Monero Mainnet Full Archival Node Configuration
# Stores the entire unpruned blockchain (~240+ GB) and enables local ZMQ for P2Pool.

data-dir=/home/monero/.bitmonero
log-file=/dev/stdout
log-level=0

# Storage
db-sync-mode=safe

# P2P Consensus Network
p2p-bind-ip=0.0.0.0
p2p-bind-port=18080
out-peers=48
in-peers=96
limit-rate-up=32768
limit-rate-down=65536
no-igd=1
enable-dns-blocklist=1

# Unrestricted RPC & ZMQ (container loopback)
rpc-bind-ip=127.0.0.1
rpc-bind-port=18081
zmq-rpc-bind-ip=0.0.0.0
zmq-rpc-bind-port=18083
zmq-pub=tcp://0.0.0.0:18084

# Restricted Wallet RPC
rpc-restricted-bind-ip=0.0.0.0
rpc-restricted-bind-port=18089
public-node=1
confirm-external-bind=1
rpc-access-control-origins=*
disable-rpc-ban=1
