<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="auto" role="img" aria-label="Monero Node Docker Architecture">
  <rect width="1200" height="440" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <text x="36" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#f0f6fc">Container Network &amp; Wallet Connectivity Architecture</text>
  <text x="36" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">How browser wallets (HTTPS + CORS), desktop/mobile wallets, and Tor clients connect to the restricted monerod RPC container</text>

  <!-- Left Column: Wallet Clients -->
  <g transform="translate(36, 98)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="0" y="0" width="290" height="92" rx="10" fill="#161b22" stroke="#ff6600" stroke-width="1.5"/>
    <text x="18" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ff6600">Browser &amp; Web Wallets</text>
    <text x="18" y="50" font-size="11.5" fill="#c9d1d9">MonkStash (monkstash.com)</text>
    <text x="18" y="70" font-size="11" fill="#8b949e">Requires HTTPS + CORS headers</text>

    <rect x="0" y="110" width="290" height="92" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="18" y="138" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#58a6ff">Desktop &amp; Mobile Wallets</text>
    <text x="18" y="160" font-size="11.5" fill="#c9d1d9">Feather, Cake Wallet, Monero GUI</text>
    <text x="18" y="180" font-size="11" fill="#8b949e">HTTPS (:443) or Restricted (:18089)</text>

    <rect x="0" y="220" width="290" height="92" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <text x="18" y="248" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#a371f7">Tor / Onion Clients</text>
    <text x="18" y="270" font-size="11.5" fill="#c9d1d9">Tor Browser, Feather, Anonero</text>
    <text x="18" y="290" font-size="11" fill="#8b949e">http://&lt;v3-address&gt;.onion:18089</text>
  </g>

  <!-- Arrows from Clients to Edge -->
  <g stroke="#8b949e" stroke-width="1.5" fill="none">
    <line x1="326" y1="144" x2="420" y2="144"/>
    <line x1="326" y1="254" x2="420" y2="174"/>
    <line x1="326" y1="364" x2="420" y2="344"/>
  </g>

  <!-- Middle Column: Reverse Proxy & Tor Sidecar -->
  <g transform="translate(420, 98)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="0" y="0" width="300" height="190" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="36" rx="10" fill="#102418"/>
    <text x="18" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3fb950">caddy (Reverse Proxy)</text>
    <text x="18" y="60" font-size="11.5" fill="#f0f6fc">• Auto Let&apos;s Encrypt TLS (:443)</text>
    <text x="18" y="84" font-size="11.5" fill="#f0f6fc">• Access-Control-Allow-Origin: *</text>
    <text x="18" y="108" font-size="11.5" fill="#f0f6fc">• Handles OPTIONS preflights</text>
    <text x="18" y="132" font-size="11.5" fill="#f0f6fc">• Blocks unsafe admin paths</text>
    <text x="18" y="160" font-size="11" fill="#3fb950">Forwards to monerod:18089</text>

    <rect x="0" y="210" width="300" height="102" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <rect x="0" y="210" width="300" height="34" rx="10" fill="#1f1633"/>
    <text x="18" y="232" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#a371f7">tor (Hidden Service Sidecar)</text>
    <text x="18" y="264" font-size="11.5" fill="#c9d1d9">HiddenServicePort 18089</text>
    <text x="18" y="288" font-size="11" fill="#8b949e">No inbound firewall ports required</text>
  </g>

  <!-- Arrows to monerod -->
  <g stroke="#3fb950" stroke-width="2" fill="none">
    <line x1="720" y1="185" x2="805" y2="185"/>
    <line x1="720" y1="350" x2="805" y2="270" stroke="#a371f7"/>
  </g>

  <!-- Right Column: monerod Container -->
  <g transform="translate(805, 98)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="0" y="0" width="358" height="312" rx="10" fill="#161b22" stroke="#ff6600" stroke-width="2"/>
    <rect x="0" y="0" width="358" height="38" rx="10" fill="#24160e"/>
    <text x="18" y="24" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ff6600">monerod (Core Daemon)</text>

    <rect x="18" y="54" width="322" height="58" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="28" y="76" font-size="12" font-weight="700" fill="#3fb950">Restricted RPC (:18089 / :38089)</text>
    <text x="28" y="96" font-size="11" fill="#8b949e">--rpc-restricted-bind-port=18089</text>

    <rect x="18" y="124" width="322" height="58" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="28" y="146" font-size="12" font-weight="700" fill="#58a6ff">P2P Consensus Network (:18080)</text>
    <text x="28" y="166" font-size="11" fill="#8b949e">--p2p-bind-port=18080 --enable-dns-blocklist</text>

    <rect x="18" y="194" width="322" height="52" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="28" y="216" font-size="12" font-weight="700" fill="#d29922">Unrestricted RPC (127.0.0.1:18081)</text>
    <text x="28" y="234" font-size="11" fill="#8b949e">Local container healthcheck only</text>

    <rect x="18" y="258" width="322" height="38" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="28" y="282" font-size="11.5" fill="#f0f6fc">Volume: /home/monero/.bitmonero (LMDB)</text>
  </g>
</svg>
